name: digmore-generate

# Runs one DIGMORE playlist generation for a profile (jazz/soul/ost) entirely
# in the cloud, so it never depends on the home PC being on. Triggered by the
# diggaplayer Android app via the GitHub REST API (workflow_dispatch), which
# then polls this run to completion and reads back results/latest-<profile>.json
# (committed straight to the repo — NOT an upload-artifact: this account's
# Actions artifact storage quota was exhausted by other repos when this was
# first built; a few KB of JSON costs nothing as a repo file, so it just
# stayed that way).
#
# DISCOGS ONLY. No YouTube and no CLAP happen here, and that is deliberate:
# YouTube refuses watch/player-response requests from this IP class outright
# (SignInConfirmNotBotException) and keeps refusing with a fully authenticated
# cookie export from a real logged-in session — verified live 28/08/2026 with
# TWO independent clients, first NewPipeExtractor (newpipe-cli/, still in the
# repo, unused) and then yt-dlp, whose cookie auth is the mature reference
# implementation. Same wall both times, so it's a check on where a session is
# being used from, not on cookie validity: nothing on the fetching side fixes
# it from a datacenter.
#
# Real CLAP scoring was NOT dropped — it moved to the phone, which has an
# ordinary mobile/home IP that YouTube serves normally. diggaplayer resolves
# each candidate, grabs a snippet, and POSTs it to the engine's /api/embed
# (see engine/app.py) for the actual similarity score. This job just produces
# good Discogs candidates, fast — hence no JDK, no torch, no ffmpeg.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Macrogenre profile"
        required: true
        type: choice
        options: [jazz, soul, ost]
      target:
        description: "How many tracks to accept before stopping"
        required: false
        default: "25"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (just requests — CLAP runs on the engine, not here)
        run: pip install --no-cache-dir requests

      - name: Generate playlist
        working-directory: engine
        run: |
          python generate_cli.py \
            --profile "${{ inputs.profile }}" \
            --target "${{ inputs.target }}" \
            --out "${{ github.workspace }}/digmore-out.json"

      - name: Publish results (commit to the repo — artifact storage quota is exhausted)
        if: always()
        run: |
          mkdir -p results
          if [ -f digmore-out.json ]; then
            cp digmore-out.json "results/latest-${{ inputs.profile }}.json"
          else
            echo '{"profile":"${{ inputs.profile }}","status":"error","results":[]}' \
              > "results/latest-${{ inputs.profile }}.json"
          fi
          git config user.name "digmore-bot"
          git config user.email "digmore-bot@users.noreply.github.com"
          git add "results/latest-${{ inputs.profile }}.json"
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "results: ${{ inputs.profile }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
