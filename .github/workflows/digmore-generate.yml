name: digmore-generate

# Runs one DIGMORE playlist generation for a profile (jazz/soul/ost) entirely
# in the cloud, so it never depends on the home PC being on. Triggered by the
# diggaplayer Android app via the GitHub REST API (workflow_dispatch), which
# then polls this run to completion and reads back results/latest-<profile>.json
# (committed straight to the repo — NOT an upload-artifact: this account's
# Actions artifact storage quota is already exhausted by other repos, and a
# few KB of JSON costs nothing as a repo file).
#
# See digmore/engine/generate_cli.py and digmore/engine/engine_libs/yt_newpipe.py
# for why this doesn't reuse yt_hunter.py's yt-dlp path: YouTube blocks plain
# HTML-scrape/yt-dlp extraction from datacenter IPs (documented in profiles.py),
# which GitHub-hosted runners are. newpipe-cli (built in this same workflow)
# resolves YouTube via NewPipeExtractor instead — the same approach
# diggaplayer/jatz use on-device — which is not affected by that block.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Macrogenre profile"
        required: true
        type: choice
        options: [jazz, soul, ost]
      target:
        description: "How many tracks to accept before stopping"
        required: false
        default: "25"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build newpipe-cli
        working-directory: newpipe-cli
        run: ./gradlew installDist --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps (CPU torch first, same order as the Dockerfile)
        working-directory: engine
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Generate playlist
        working-directory: engine
        env:
          NEWPIPE_CLI_PATH: ${{ github.workspace }}/newpipe-cli/build/install/newpipe-cli/bin/newpipe-cli
          HF_HOME: ${{ github.workspace }}/.hf-cache
          DIGGER_DEBUG: "1"
        run: |
          python generate_cli.py \
            --profile "${{ inputs.profile }}" \
            --target "${{ inputs.target }}" \
            --out "${{ github.workspace }}/digmore-out.json"

      - name: Publish results (commit to the repo — artifact storage quota is exhausted)
        if: always()
        run: |
          mkdir -p results
          if [ -f digmore-out.json ]; then
            cp digmore-out.json "results/latest-${{ inputs.profile }}.json"
          else
            echo '{"profile":"${{ inputs.profile }}","status":"error","results":[]}' \
              > "results/latest-${{ inputs.profile }}.json"
          fi
          git config user.name "digmore-bot"
          git config user.email "digmore-bot@users.noreply.github.com"
          git add "results/latest-${{ inputs.profile }}.json"
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "results: ${{ inputs.profile }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
