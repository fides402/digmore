name: digmore-generate

# Runs one DIGMORE playlist generation for a profile (jazz/soul/ost) entirely
# in the cloud, so it never depends on the home PC being on. Triggered by the
# diggaplayer Android app via the GitHub REST API (workflow_dispatch), which
# then polls this run to completion and reads back results/latest-<profile>.json
# (committed straight to the repo — NOT an upload-artifact: this account's
# Actions artifact storage quota was exhausted by other repos when this was
# first built; a few KB of JSON costs nothing as a repo file, so it just
# stayed that way).
#
# Uses yt_hunter.py (yt-dlp) for the per-candidate YouTube step — a first
# attempt swapped it for a homemade NewPipeExtractor-based tool (newpipe-cli/,
# still in the repo, unused) specifically to dodge YouTube's block on
# anonymous watch/player-response requests from datacenter IPs
# (SignInConfirmNotBotException). That attempt's own cookie support (just
# attaching a raw Cookie header) turned out to not be enough — tested live,
# still blocked with real cookies. yt-dlp's cookie auth is a mature,
# maintained implementation of the real thing (Google's SAPISIDHASH-signed
# requests), and yt_hunter.py already had YT_COOKIES_FILE support built for
# the exact same block on Hugging Face Spaces (see profiles.py) — it just had
# never actually been tried against a GitHub Actions runner specifically.
# Needs Node.js (yt-dlp's `js_runtimes` JS-challenge solver) and ffmpeg.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Macrogenre profile"
        required: true
        type: choice
        options: [jazz, soul, ost]
      target:
        description: "How many tracks to accept before stopping"
        required: false
        default: "25"
      yt_cookies:
        description: "Netscape-format YouTube cookies.txt content (required — YouTube blocks anonymous watch access from this runner's IP without them)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (yt-dlp's JS-challenge solver)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps (CPU torch first, same order as the Dockerfile)
        working-directory: engine
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Write YouTube cookies
        if: inputs.yt_cookies != ''
        env:
          # Passed via env, not interpolated into the script body, so cookie
          # values containing shell metacharacters ($, `, ", ...) can't break
          # or inject into this step.
          DIGMORE_YT_COOKIES: ${{ inputs.yt_cookies }}
        run: |
          printf '%s\n' "$DIGMORE_YT_COOKIES" > "${{ github.workspace }}/yt_cookies.txt"
          # Diagnostic only (no cookie values logged): line count, byte
          # count, and whether real tabs/newlines survived the round trip
          # through the workflow_dispatch input — the file must be
          # tab-separated (Netscape format) for yt-dlp to accept it.
          echo "--- cookie file diagnostic ---"
          echo "lines: $(wc -l < "${{ github.workspace }}/yt_cookies.txt")"
          echo "bytes: $(wc -c < "${{ github.workspace }}/yt_cookies.txt")"
          echo "tab count: $(tr -cd '\t' < "${{ github.workspace }}/yt_cookies.txt" | wc -c)"
          echo "first line length: $(head -1 "${{ github.workspace }}/yt_cookies.txt" | wc -c)"
          echo "--- end diagnostic ---"

      - name: Generate playlist
        working-directory: engine
        env:
          YT_COOKIES_FILE: ${{ github.workspace }}/yt_cookies.txt
          HF_HOME: ${{ github.workspace }}/.hf-cache
          DIGGER_DEBUG: "1"
        run: |
          python generate_cli.py \
            --profile "${{ inputs.profile }}" \
            --target "${{ inputs.target }}" \
            --out "${{ github.workspace }}/digmore-out.json"

      - name: Publish results (commit to the repo — artifact storage quota is exhausted)
        if: always()
        run: |
          mkdir -p results
          if [ -f digmore-out.json ]; then
            cp digmore-out.json "results/latest-${{ inputs.profile }}.json"
          else
            echo '{"profile":"${{ inputs.profile }}","status":"error","results":[]}' \
              > "results/latest-${{ inputs.profile }}.json"
          fi
          git config user.name "digmore-bot"
          git config user.email "digmore-bot@users.noreply.github.com"
          git add "results/latest-${{ inputs.profile }}.json"
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "results: ${{ inputs.profile }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
