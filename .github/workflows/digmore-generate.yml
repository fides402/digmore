name: digmore-generate

# Runs one DIGMORE candidate-list generation for a profile (jazz/soul/ost)
# entirely in the cloud, so it never depends on the home PC being on.
# Triggered by the diggaplayer Android app via the GitHub REST API
# (workflow_dispatch), which then polls this run to completion and reads
# back results/latest-<profile>.json (committed straight to the repo — NOT
# an upload-artifact: this account's Actions artifact storage quota is
# already exhausted by other repos, and a few KB of JSON costs nothing as a
# repo file).
#
# This is Discogs-only (discogs_ext.build_candidates): a first version tried
# resolving each candidate on YouTube and CLAP-scoring the audio (see the
# newpipe-cli/ module and yt_newpipe.py, still in the repo but unused by
# generate_cli.py now) — search worked fine from a GitHub-hosted IP, but the
# watch/player-response step YouTube gates behind SignInConfirmNotBotException
# ("Sign in to confirm you're not a bot") for every single candidate, tested
# live. That's an IP-reputation gate, not a client-library problem — swapping
# yt-dlp for NewPipeExtractor fixed the search half (which worked) but not
# the fetch half (which doesn't, on this class of IP). Real curation now
# happens on the phone instead: DigmoreViewModel searches each Discogs
# candidate on Spotify and only keeps confident matches — which was always
# the step that actually decides "is this real enough to put in the
# playlist", CLAP or not.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Macrogenre profile"
        required: true
        type: choice
        options: [jazz, soul, ost]
      target:
        description: "How many Discogs candidates to gather (Spotify filtering on the phone will shrink this)"
        required: false
        default: "25"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (just requests — no torch/CLAP needed anymore)
        run: pip install --no-cache-dir requests

      - name: Generate candidate list
        working-directory: engine
        run: |
          python generate_cli.py \
            --profile "${{ inputs.profile }}" \
            --target "${{ inputs.target }}" \
            --out "${{ github.workspace }}/digmore-out.json"

      - name: Publish results (commit to the repo — artifact storage quota is exhausted)
        if: always()
        run: |
          mkdir -p results
          if [ -f digmore-out.json ]; then
            cp digmore-out.json "results/latest-${{ inputs.profile }}.json"
          else
            echo '{"profile":"${{ inputs.profile }}","status":"error","results":[]}' \
              > "results/latest-${{ inputs.profile }}.json"
          fi
          git config user.name "digmore-bot"
          git config user.email "digmore-bot@users.noreply.github.com"
          git add "results/latest-${{ inputs.profile }}.json"
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "results: ${{ inputs.profile }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
