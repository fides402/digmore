name: digmore-generate

# Runs one DIGMORE playlist generation for a profile (jazz/soul/ost) entirely
# in the cloud, so it never depends on the home PC being on. Triggered by the
# diggaplayer Android app via the GitHub REST API (workflow_dispatch), which
# then polls this run to completion and reads back results/latest-<profile>.json
# (committed straight to the repo — NOT an upload-artifact: this account's
# Actions artifact storage quota was exhausted by other repos when this was
# first built; a few KB of JSON costs nothing as a repo file, so it just
# stayed that way).
#
# See digmore/engine/generate_cli.py and digmore/engine/engine_libs/yt_newpipe.py
# for why this doesn't reuse yt_hunter.py's yt-dlp path: YouTube blocks
# anonymous access to the watch/player-response endpoint from datacenter IPs
# (SignInConfirmNotBotException, confirmed live — search itself is NOT
# blocked, only that one endpoint). newpipe-cli (built in this same workflow)
# resolves YouTube via NewPipeExtractor instead — the same approach
# diggaplayer/jatz use on-device — but the actual fix for the block is real
# cookies from a logged-in session, passed in via the `yt_cookies` input
# below (the app can re-send fresh ones any time they expire — no need to
# ever touch a GitHub secret by hand).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Macrogenre profile"
        required: true
        type: choice
        options: [jazz, soul, ost]
      target:
        description: "How many tracks to accept before stopping"
        required: false
        default: "25"
      yt_cookies:
        description: "Netscape-format YouTube cookies.txt content (optional, but the watch/player-response endpoint is blocked without them from this runner)"
        required: false
        default: ""

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build newpipe-cli
        working-directory: newpipe-cli
        run: ./gradlew installDist --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps (CPU torch first, same order as the Dockerfile)
        working-directory: engine
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Write YouTube cookies
        if: inputs.yt_cookies != ''
        env:
          # Passed via env, not interpolated into the script body, so cookie
          # values containing shell metacharacters ($, `, ", ...) can't break
          # or inject into this step.
          DIGMORE_YT_COOKIES: ${{ inputs.yt_cookies }}
        run: printf '%s\n' "$DIGMORE_YT_COOKIES" > "${{ github.workspace }}/yt_cookies.txt"

      - name: Generate playlist
        working-directory: engine
        env:
          NEWPIPE_CLI_PATH: ${{ github.workspace }}/newpipe-cli/build/install/newpipe-cli/bin/newpipe-cli
          YT_COOKIES_FILE: ${{ github.workspace }}/yt_cookies.txt
          HF_HOME: ${{ github.workspace }}/.hf-cache
          DIGGER_DEBUG: "1"
        run: |
          python generate_cli.py \
            --profile "${{ inputs.profile }}" \
            --target "${{ inputs.target }}" \
            --out "${{ github.workspace }}/digmore-out.json"

      - name: Publish results (commit to the repo — artifact storage quota is exhausted)
        if: always()
        run: |
          mkdir -p results
          if [ -f digmore-out.json ]; then
            cp digmore-out.json "results/latest-${{ inputs.profile }}.json"
          else
            echo '{"profile":"${{ inputs.profile }}","status":"error","results":[]}' \
              > "results/latest-${{ inputs.profile }}.json"
          fi
          git config user.name "digmore-bot"
          git config user.email "digmore-bot@users.noreply.github.com"
          git add "results/latest-${{ inputs.profile }}.json"
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "results: ${{ inputs.profile }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
